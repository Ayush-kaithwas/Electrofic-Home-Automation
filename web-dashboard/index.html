<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Electrofic — Smart Home Control</title>
  <meta name="description" content="Next-Gen Smart Home Control Center — Water Monitoring, Climate Sensors, Electricity Billing, and 5 Floor Switchboards.">
  <meta name="keywords" content="smart home, home automation, IoT dashboard, water monitoring, switchboard control">
  <meta name="author" content="Electrofic">

  <!-- PWA: Theme & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#06b6d4">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- PWA: Apple / iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Electrofic">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-startup-image" href="icons/icon-512.png">

  <!-- PWA: Microsoft / Windows -->
  <meta name="msapplication-TileColor" content="#070A12">
  <meta name="msapplication-TileImage" content="icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- AuraHome Stylesheet -->
  <link rel="stylesheet" href="style.css?v=1.2.0">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Firebase App, Auth & Database Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- React Mount Target -->
  <div id="root"></div>

  <!-- AuraHome React App Bundle -->
  <script src="src/app-bundle.js?v=1.2.0"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(reg) {
            console.log('[Electrofic PWA] Service Worker registered. Scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[Electrofic PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>

</body>
</html>
